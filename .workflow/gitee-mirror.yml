version: '1.0'
name: gitee-mirror
displayName: Gitee 镜像同步
ref_variable:
  - SYNC_GITEE_TOKEN
strategy:
  blocking: true
triggers:
  trigger: auto
  push:
    branches:
      precise:
        - mirror-notify
    commitMessages:
      include:
        - '^ci: request mirror sync.*'
stages:
  - name: sync
    displayName: 同步代码与最新 Release
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@gcc
        name: mirror_sync
        displayName: 同步通知对应的仓库
        gccVersion: '10.3'
        commands:
          - set -e
          - bash .workflow/mirror_sync.sh --request .workflow/mirror-request.json
        caches: []
        notify: []
        strategy:
          retry: '0'
          timeout: 30
