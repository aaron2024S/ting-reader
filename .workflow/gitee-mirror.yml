version: '1.0'
name: gitee-mirror
displayName: Gitee 镜像同步
triggers:
  trigger: auto
  schedule:
    - cron: '23 */4 * * ?'
stages:
  - name: sync
    displayName: 同步代码与最新 Release
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@nodejs
        name: mirror_sync
        displayName: 同步 9 个仓库
        nodeVersion: 14.16.0
        commands:
          - set -e
          - bash .workflow/mirror_sync.sh
        caches: []
        notify: []
        strategy:
          retry: '0'
