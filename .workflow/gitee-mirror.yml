version: '1.0'
name: gitee-mirror
displayName: Gitee 镜像同步
ref_variable:
  - SYNC_GITEE_TOKEN
strategy:
  blocking: true
  stepTimeout: 30
triggers:
  trigger: auto
  push:
    branches:
      precise:
        - mirror-notify
    commitMessages:
      include:
        - '^ci: request mirror sync.*'
stages:
  - name: sync
    displayName: 同步代码与最新 Release
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@gcc
        name: mirror_sync
        displayName: 同步 9 个仓库
        gccVersion: '10.3'
        commands:
          - set -e
          # The notification branch is independent of the mirrored main branch.
          - curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/dqsq2e2/ting-reader/main/.workflow/mirror_sync.sh -o /tmp/ting-reader-mirror-sync.sh
          - MIRROR_REPOS="$(python3 -c 'import json; print(json.load(open(".workflow/mirror-request.json"))["repository"].split("/")[-1])')"
          - export MIRROR_REPOS
          - bash /tmp/ting-reader-mirror-sync.sh
        caches: []
        notify: []
        strategy:
          retry: '0'
